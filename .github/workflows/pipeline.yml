name: Application CI and Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build and scan
    runs-on: ubuntu-latest
    env:
      ENABLE_SNYK: ${{ vars.ENABLE_SNYK }}
      ENABLE_SONAR: ${{ vars.ENABLE_SONAR }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: apps/SkillPulse/backend/go.mod

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Resolve Go dependencies
        working-directory: apps/SkillPulse/backend
        run: go mod tidy

      - name: Run backend tests
        working-directory: apps/SkillPulse/backend
        run: go test ./...

      - name: Vet backend
        working-directory: apps/SkillPulse/backend
        run: go vet ./...

      - name: Build backend image
        run: docker build -t one-man-army-backend:${{ github.sha }} apps/SkillPulse/backend

      - name: Build frontend image
        run: docker build -f apps/SkillPulse/Dockerfile.frontend -t one-man-army-frontend:${{ github.sha }} apps/SkillPulse

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned action commit
        with:
          image-ref: one-man-army-backend:${{ github.sha }}
          format: json
          output: reports/backend-trivy.json
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned action commit
        with:
          image-ref: one-man-army-frontend:${{ github.sha }}
          format: json
          output: reports/frontend-trivy.json
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Set up Node.js for Snyk CLI
        if: env.ENABLE_SNYK == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pinned Snyk CLI
        if: env.ENABLE_SNYK == 'true'
        run: npm install --global snyk@1.1297.0

      - name: Run Snyk dependency scan
        if: env.ENABLE_SNYK == 'true'
        working-directory: apps/SkillPulse/backend
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=go.mod --json > ../../../reports/snyk.json

      - name: Run SonarCloud analysis
        if: env.ENABLE_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=apps/SkillPulse

      - name: Publish images to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets before enabling PUBLISH_IMAGES." >&2
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          for component in backend frontend; do
            local_image="one-man-army-${component}:${GITHUB_SHA}"
            remote_image="${DOCKERHUB_USERNAME}/skillpulse-${component}"
            docker tag "$local_image" "${remote_image}:${GITHUB_SHA}"
            docker tag "$local_image" "${remote_image}:latest"
            docker push "${remote_image}:${GITHUB_SHA}"
            docker push "${remote_image}:latest"
          done

      - name: Run OWASP ZAP baseline scan
        if: env.APP_BASE_URL != ''
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: ${{ vars.APP_BASE_URL }}
          artifact_name: zap-baseline-report

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  terraform-and-helm:
    name: Validate infrastructure and chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.1

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform without backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate -no-color

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.4

      - name: Lint Helm chart
        run: helm lint helm/three-tier

      - name: Render Helm chart
        run: helm template three-tier helm/three-tier --namespace three-tier

  publish-reports:
    name: Publish main-branch security report
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: security-reports
          path: public/reports
          if-no-artifact-found: warn

      - name: Build report index
        run: |
          mkdir -p public
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Security scan reports</title><style>body{font:16px system-ui;max-width:900px;margin:48px auto;padding:0 20px;color:#202820}h1{font-size:28px}li{margin:12px 0}code{font-family:ui-monospace,monospace}</style><h1>Security scan reports</h1><p>Automated reports for the latest main-branch pipeline run.</p><ul>' > public/index.html
          for file in public/reports/*; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            printf '<li><a href="reports/%s">%s</a></li>\n' "$name" "$name" >> public/index.html
          done
          printf '%s\n' '</ul></html>' >> public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
