{{- if not .Values.mysql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  init.sql: |-
{{ .Files.Get "files/init.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: database-init
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: initialize-schema
          image: mysql:8.4
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --database="$DB_NAME" < /schema/init.sql
              mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --execute="CREATE USER IF NOT EXISTS '$APP_USER'@'%' IDENTIFIED BY '$APP_PASSWORD'; ALTER USER '$APP_USER'@'%' IDENTIFIED BY '$APP_PASSWORD'; GRANT ALL PRIVILEGES ON $DB_NAME.* TO '$APP_USER'@'%';"
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret }}
                  key: db-host
            - name: DB_PORT
              value: "{{ .Values.service.mysql.port }}"
            - name: DB_USER
              value: {{ .Values.mysql.adminUser | quote }}
            - name: DB_NAME
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret }}
                  key: root-password
            - name: APP_USER
              value: {{ .Values.mysql.user | quote }}
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret }}
                  key: app-password
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: database-init
{{- end }}