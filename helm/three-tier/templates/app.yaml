apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec: {containers: [{name: frontend,image: "{{ .Values.images.frontend }}:{{ .Values.images.tag }}",ports: [{containerPort: 80}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec: {selector: {app: frontend}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.images.backend }}:{{ .Values.images.tag }}"
          ports: [{containerPort: 8080}]
          env:
            - {name: DB_HOST, value: mysql}
            - {name: DB_USER, value: app}
            - {name: DB_NAME, value: appdb}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: "{{ .Values.mysql.existingSecret }}", key: app-password}}
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec: {selector: {app: backend}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mysql}
spec:
  serviceName: mysql
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - {name: MYSQL_DATABASE, value: appdb}
            - {name: MYSQL_USER, value: app}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: "{{ .Values.mysql.existingSecret }}", key: app-password}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: "{{ .Values.mysql.existingSecret }}", key: root-password}}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: "{{ .Values.mysql.storage }}"}}}
---
apiVersion: v1
kind: Service
metadata: {name: mysql}
spec: {clusterIP: None, selector: {app: mysql}, ports: [{port: 3306}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: app}
spec:
  rules:
    - http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: backend, port: {number: 8080}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 80}}}}
